<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f0f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#244069" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#2c66d6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#7950cf"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#0a9188"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#db7b22"/>
    </marker>
    <style>
      .font { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #17243a; }
      .frame-title { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
      .node-title { font-size: 23px; font-weight: 700; fill: #17243a; }
      .node-text { font-size: 16px; fill: #66738a; }
    </style>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="font title">FindTag System Architecture</text>

  <!-- Customer-managed system boundary -->
  <rect x="35" y="105" width="600" height="610" rx="30" fill="#fbf9ff" stroke="#9b80d8" stroke-width="3"/>
  <rect x="62" y="84" width="330" height="43" rx="21" fill="#7950cf"/>
  <text x="227" y="112" text-anchor="middle" class="font frame-title" fill="#ffffff">Customer-managed User System</text>

  <!-- User -->
  <rect x="75" y="280" width="145" height="110" rx="24" fill="#ffffff" stroke="#b8c5d8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="147" cy="314" r="17" fill="#dce5f4"/>
  <path d="M114 364c4-20 17-30 33-30s29 10 33 30" fill="#dce5f4"/>
  <text x="147" y="380" text-anchor="middle" class="font node-title">User</text>

  <!-- Customer App -->
  <rect x="285" y="180" width="290" height="235" rx="28" fill="#ffffff" stroke="#8aa2c7" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="232" text-anchor="middle" class="font node-title">Customer App</text>
  <rect x="335" y="286" width="190" height="76" rx="18" fill="#eaf2ff" stroke="#5d8de0" stroke-width="2"/>
  <text x="430" y="332" text-anchor="middle" class="font node-title" fill="#2459b5">FindTag SDK</text>

  <!-- Customer Server -->
  <rect x="285" y="505" width="290" height="135" rx="27" fill="#f3edff" stroke="#9677d5" stroke-width="3" filter="url(#shadow)"/>
  <text x="430" y="556" text-anchor="middle" class="font node-title" fill="#6440aa">Customer Server</text>
  <text x="430" y="592" text-anchor="middle" class="font node-text">Accounts &amp; Devices</text>

  <!-- Standalone Tag device -->
  <rect x="674" y="438" width="190" height="130" rx="27" fill="#e9faf8" stroke="#48aaa2" stroke-width="3" filter="url(#shadow)"/>
  <text x="769" y="493" text-anchor="middle" class="font node-title" fill="#0b756f">Tag Device</text>
  <text x="769" y="528" text-anchor="middle" class="font node-text">Bluetooth</text>

  <!-- FindTag platform boundary -->
  <rect x="904" y="105" width="460" height="610" rx="30" fill="#f5f8ff" stroke="#6d91d1" stroke-width="3"/>
  <rect x="932" y="84" width="220" height="43" rx="21" fill="#2c66d6"/>
  <text x="1042" y="112" text-anchor="middle" class="font frame-title" fill="#ffffff">FindTag Platform</text>

  <!-- FindTag Server -->
  <rect x="974" y="205" width="320" height="145" rx="28" fill="#eaf2ff" stroke="#5d8de0" stroke-width="3" filter="url(#shadow)"/>
  <text x="1134" y="260" text-anchor="middle" class="font node-title" fill="#2459b5">FindTag Server</text>
  <text x="1134" y="298" text-anchor="middle" class="font node-text">Official Services / Open API</text>

  <!-- Tag Point Server -->
  <rect x="974" y="505" width="320" height="135" rx="28" fill="#fff6e8" stroke="#e1a052" stroke-width="3" filter="url(#shadow)"/>
  <text x="1134" y="556" text-anchor="middle" class="font node-title" fill="#aa5d15">Tag Point Server</text>
  <text x="1134" y="592" text-anchor="middle" class="font node-text">Location Data</text>

  <!-- Simple straight connections -->
  <path d="M220 335H276" fill="none" stroke="#596b85" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <path d="M430 415V496" fill="none" stroke="#7950cf" stroke-width="4" marker-start="url(#arrowPurple)" marker-end="url(#arrowPurple)"/>

  <path d="M525 324H835V277H965" fill="none" stroke="#2c66d6" stroke-width="4" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>

  <path d="M525 350L671 472" fill="none" stroke="#0a9188" stroke-width="4" marker-start="url(#arrowTeal)" marker-end="url(#arrowTeal)"/>

  <path d="M1134 350V496" fill="none" stroke="#db7b22" stroke-width="4" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>

  <path d="M864 526H965" fill="none" stroke="#db7b22" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrowOrange)"/>

  <!-- Minimal legend -->
  <rect x="305" y="735" width="790" height="32" rx="16" fill="#ffffff" stroke="#d6dfed"/>
  <circle cx="340" cy="751" r="6" fill="#7950cf"/>
  <text x="356" y="757" class="font node-text">Customer business</text>
  <circle cx="560" cy="751" r="6" fill="#2c66d6"/>
  <text x="576" y="757" class="font node-text">FindTag services</text>
  <circle cx="775" cy="751" r="6" fill="#0a9188"/>
  <text x="791" y="757" class="font node-text">Bluetooth</text>
  <circle cx="920" cy="751" r="6" fill="#db7b22"/>
  <text x="936" y="757" class="font node-text">Location data</text>
</svg>
